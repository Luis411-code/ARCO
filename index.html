<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCO - Publicidad y Comunicación Gráfica</title>
    <meta name="description" content="ARCO: Publicidad y Comunicación Gráfica en Holguín. Cartelería, señalética, impresión y diseño. Calidad y garantía en cada proyecto." />
    
    <style>
      /* ===== RESET Y FONDO DE RESPALDO ===== */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        background: #0a3d6b;
      }

      #root {
        min-height: 100vh;
        background: white;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #root.visible {
        opacity: 1;
        visibility: visible;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(135deg, #0a1628 0%, #0d2847 40%, #1a3a5c 70%, #0d2847 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .preloader-icon {
        width: 80px;
        height: 80px;
        animation: pulse-icon 1.5s ease-in-out infinite;
        filter: drop-shadow(0 0 30px rgba(240, 180, 41, 0.15));
      }

      @keyframes pulse-icon {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }

      .preloader-number {
        font-size: 40px;
        font-weight: 200;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 20px;
        font-family: 'Inter', system-ui, sans-serif;
      }

      .preloader-number .percent {
        color: #f0b429;
        font-size: 20px;
      }

      .preloader-bar {
        width: 180px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 12px;
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        background: #f0b429;
        border-radius: 4px;
        transition: width 0.15s ease;
      }

      .preloader-status {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-top: 16px;
        font-family: 'Inter', system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <!-- PRELOADER -->
    <div id="preloader">
      <img src="/logo.svg" alt="ARCO" class="preloader-icon" />
      <div class="preloader-number">
        <span id="progressNumber">0</span><span class="percent">%</span>
      </div>
      <div class="preloader-bar">
        <div class="preloader-bar-fill" id="progressBar"></div>
      </div>
      <div class="preloader-status" id="statusText">Cargando...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        // ===== CONTROL DE EJECUCIÓN ÚNICA =====
        if (window._preloaderExecuted) {
          // Si ya se ejecutó, ocultar preloader inmediatamente
          const preloader = document.getElementById('preloader');
          const root = document.getElementById('root');
          if (preloader) preloader.classList.add('hidden');
          if (root) root.classList.add('visible');
          return;
        }
        window._preloaderExecuted = true;

        const preloader = document.getElementById('preloader');
        const progressBar = document.getElementById('progressBar');
        const progressNumber = document.getElementById('progressNumber');
        const statusText = document.getElementById('statusText');
        const root = document.getElementById('root');

        let progress = 0;
        let isComplete = false;
        const duration = 2000;
        const interval = 25;
        const steps = duration / interval;

        const statusMessages = [
          { min: 0, max: 25, text: 'Iniciando...' },
          { min: 25, max: 50, text: 'Cargando recursos...' },
          { min: 50, max: 75, text: 'Preparando experiencia...' },
          { min: 75, max: 95, text: 'Casi listo...' }
        ];

        function updateProgress() {
          if (isComplete) return;
          
          progress += 100 / steps;
          
          if (progress >= 100) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            
            statusText.textContent = '✨ ¡Listo! ✨';
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 100);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 400);
          }

          const rounded = Math.min(Math.round(progress), 100);
          progressBar.style.width = rounded + '%';
          progressNumber.textContent = rounded;

          const currentStatus = statusMessages.find(
            msg => rounded >= msg.min && rounded < msg.max
          );
          if (currentStatus && rounded < 100) {
            statusText.textContent = currentStatus.text;
          }
        }

        const timer = setInterval(updateProgress, interval);

        setTimeout(() => {
          if (!preloader.classList.contains('hidden')) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            progressBar.style.width = '100%';
            progressNumber.textContent = '100';
            statusText.textContent = '✨ ¡Listo! ✨';
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 100);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 400);
          }
        }, 3500);

        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
      })();
    </script>
  </body>
</html>
