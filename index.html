<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCO - Publicidad y Comunicación Gráfica</title>
    <meta name="description" content="ARCO: Publicidad y Comunicación Gráfica en Holguín. Cartelería, señalética, impresión y diseño." />
    
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        background: #0a3d6b;
      }

      #root {
        min-height: 100vh;
        background: white;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #root.visible {
        opacity: 1;
        visibility: visible;
      }

      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(135deg, #0a1628 0%, #0d2847 40%, #1a3a5c 70%, #0d2847 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ===== LOGO TRANSPARENTE CON PULSACIÓN ===== */
      .preloader-logo {
        position: relative;
        height: 90px;
        width: auto;
        display: block;
        animation: pulse-logo 2.2s ease-in-out infinite;
        filter: drop-shadow(0 0 30px rgba(240, 180, 41, 0.15));
      }

      /* Anillo de luz alrededor del logo */
      .preloader-logo::after {
        content: '';
        position: absolute;
        inset: -20px;
        border-radius: 50%;
        background: radial-gradient(circle at center, rgba(240, 180, 41, 0.08), transparent 70%);
        animation: pulse-glow 2.2s ease-in-out infinite;
        z-index: -1;
      }

      @keyframes pulse-logo {
        0%, 100% { 
          transform: scale(1); 
          filter: drop-shadow(0 0 30px rgba(240, 180, 41, 0.15));
        }
        50% { 
          transform: scale(1.06); 
          filter: drop-shadow(0 0 60px rgba(240, 180, 41, 0.3));
        }
      }

      @keyframes pulse-glow {
        0%, 100% { 
          opacity: 0.3;
          transform: scale(1);
        }
        50% { 
          opacity: 0.8;
          transform: scale(1.2);
        }
      }

      /* ===== NÚMERO ===== */
      .preloader-number {
        font-size: 40px;
        font-weight: 200;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 32px;
        font-family: 'Inter', system-ui, sans-serif;
        letter-spacing: 2px;
      }

      .preloader-number .percent {
        color: #f0b429;
        font-size: 20px;
        font-weight: 300;
      }

      /* ===== BARRA ===== */
      .preloader-bar {
        width: 200px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        margin-top: 16px;
        position: relative;
      }

      .preloader-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(240, 180, 41, 0.1), transparent);
        animation: shimmer-bar 1.8s ease-in-out infinite;
      }

      @keyframes shimmer-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #f0b429, #f5d06a, #f0b429);
        border-radius: 4px;
        transition: width 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 25px rgba(240, 180, 41, 0.3);
        position: relative;
        z-index: 1;
      }

      /* ===== TEXTO DE ESTADO ===== */
      .preloader-status {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 18px;
        font-family: 'Inter', system-ui, sans-serif;
        transition: all 0.3s ease;
        min-height: 20px;
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 640px) {
        .preloader-logo {
          height: 70px;
        }
        .preloader-number {
          font-size: 32px;
        }
        .preloader-bar {
          width: 160px;
        }
      }

      @media (max-width: 400px) {
        .preloader-logo {
          height: 55px;
        }
        .preloader-number {
          font-size: 26px;
        }
        .preloader-bar {
          width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <!-- PRELOADER -->
    <div id="preloader">
      <img src="/logo.png" alt="ARCO" class="preloader-logo" />
      <div class="preloader-number">
        <span id="progressNumber">0</span><span class="percent">%</span>
      </div>
      <div class="preloader-bar">
        <div class="preloader-bar-fill" id="progressBar"></div>
      </div>
      <div class="preloader-status" id="statusText">Iniciando...</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function() {
        const preloader = document.getElementById('preloader');
        const progressBar = document.getElementById('progressBar');
        const progressNumber = document.getElementById('progressNumber');
        const statusText = document.getElementById('statusText');
        const root = document.getElementById('root');

        let progress = 0;
        let isComplete = false;
        const duration = 2000;
        const interval = 25;
        const steps = duration / interval;

        const statusMessages = [
          { min: 0, max: 20, text: 'Iniciando...' },
          { min: 20, max: 45, text: 'Cargando recursos...' },
          { min: 45, max: 70, text: 'Preparando experiencia...' },
          { min: 70, max: 90, text: 'Casi listo...' }
        ];

        function updateProgress() {
          if (isComplete) return;
          
          progress += 100 / steps;
          
          if (progress >= 100) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            
            statusText.textContent = '✨ ¡Listo! ✨';
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 150);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 500);
          }

          const rounded = Math.min(Math.round(progress), 100);
          progressBar.style.width = rounded + '%';
          progressNumber.innerHTML = rounded + '<span class="percent">%</span>';

          const currentStatus = statusMessages.find(
            msg => rounded >= msg.min && rounded < msg.max
          );
          if (currentStatus && rounded < 100) {
            statusText.textContent = currentStatus.text;
          }
        }

        const timer = setInterval(updateProgress, interval);

        setTimeout(() => {
          if (!preloader.classList.contains('hidden')) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            progressBar.style.width = '100%';
            progressNumber.innerHTML = '100<span class="percent">%</span>';
            statusText.textContent = '✨ ¡Listo! ✨';
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 150);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 500);
          }
        }, 3500);

        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
      })();
    </script>
  </body>
</html>
