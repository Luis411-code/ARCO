<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARCO - Publicidad y Comunicación Gráfica</title>
    <meta name="description" content="ARCO: Publicidad y Comunicación Gráfica en Holguín. Cartelería, señalética, impresión y diseño." />
    
    <style>
      /* ============================================================
         RESET Y FONDO DE RESPALDO
         ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
        background: #0a3d6b;
      }

      #root {
        min-height: 100vh;
        background: white;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }

      #root.visible {
        opacity: 1;
        visibility: visible;
      }

      /* ============================================================
         PRELOADER
         ============================================================ */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: linear-gradient(135deg, #0a1628 0%, #0d2847 40%, #1a3a5c 70%, #0d2847 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease, visibility 0.5s ease;
        overflow: hidden;
      }

      #preloader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* ===== FONDO CON GLOW ===== */
      .preloader-glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.1;
        animation: float-glow 6s ease-in-out infinite alternate;
      }

      .preloader-glow-1 {
        width: 300px;
        height: 300px;
        background: #f0b429;
        top: -100px;
        right: -100px;
        animation-delay: 0s;
      }

      .preloader-glow-2 {
        width: 250px;
        height: 250px;
        background: #0a3d6b;
        bottom: -80px;
        left: -80px;
        animation-delay: 2s;
      }

      .preloader-glow-3 {
        width: 200px;
        height: 200px;
        background: #f5d06a;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation-delay: 4s;
        opacity: 0.05;
      }

      @keyframes float-glow {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(30px, -30px) scale(1.2); }
      }

      /* ===== LOGO CON FONDO CLARO ===== */
      .preloader-logo-wrapper {
        position: relative;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 16px;
        border-radius: 28px;
        box-shadow: 0 0 60px rgba(240, 180, 41, 0.15), 0 0 120px rgba(240, 180, 41, 0.05);
        border: 2px solid rgba(240, 180, 41, 0.25);
        animation: pulse-icon 2s ease-in-out infinite;
        transition: all 0.3s ease;
        z-index: 2;
      }

      .preloader-logo-wrapper::before {
        content: '';
        position: absolute;
        inset: -8px;
        border-radius: 34px;
        background: linear-gradient(135deg, rgba(240, 180, 41, 0.1), transparent, rgba(240, 180, 41, 0.1));
        animation: pulse-ring 2.2s ease-in-out infinite;
        z-index: -1;
      }

      .preloader-logo-wrapper::after {
        content: '';
        position: absolute;
        inset: -16px;
        border-radius: 42px;
        background: radial-gradient(circle at center, rgba(240, 180, 41, 0.06), transparent 70%);
        animation: pulse-glow 2.2s ease-in-out infinite;
        z-index: -2;
      }

      .preloader-logo-wrapper img {
        height: 80px;
        width: auto;
        display: block;
        border-radius: 20px;
        object-fit: contain;
        filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.08));
      }

      @keyframes pulse-icon {
        0%, 100% { 
          transform: scale(1); 
          border-color: rgba(240, 180, 41, 0.25);
          box-shadow: 0 0 60px rgba(240, 180, 41, 0.15);
        }
        50% { 
          transform: scale(1.04); 
          border-color: rgba(240, 180, 41, 0.4);
          box-shadow: 0 0 100px rgba(240, 180, 41, 0.25);
        }
      }

      @keyframes pulse-ring {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }

      @keyframes pulse-glow {
        0%, 100% { opacity: 0.2; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }

      /* ===== NÚMERO ===== */
      .preloader-number {
        font-size: 48px;
        font-weight: 200;
        color: rgba(255, 255, 255, 0.9);
        margin-top: 32px;
        font-family: 'Inter', system-ui, sans-serif;
        letter-spacing: 2px;
        z-index: 2;
        position: relative;
      }

      .preloader-number .percent {
        color: #f0b429;
        font-size: 24px;
        font-weight: 300;
      }

      /* ===== BARRA ===== */
      .preloader-bar-wrapper {
        width: 220px;
        margin-top: 16px;
        position: relative;
        z-index: 2;
      }

      .preloader-bar-track {
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      .preloader-bar-track::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(240, 180, 41, 0.1), transparent);
        animation: shimmer-bar 1.8s ease-in-out infinite;
      }

      @keyframes shimmer-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }

      .preloader-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #f0b429, #f5d06a, #f0b429);
        border-radius: 4px;
        transition: width 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 0 25px rgba(240, 180, 41, 0.3);
        position: relative;
        z-index: 1;
      }

      /* ===== PUNTOS DECORATIVOS ===== */
      .preloader-dots {
        display: flex;
        justify-content: space-between;
        width: 220px;
        margin-top: 12px;
        padding: 0 2px;
        position: relative;
        z-index: 2;
      }

      .preloader-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }

      .preloader-dot.active {
        background: #f0b429;
        box-shadow: 0 0 20px rgba(240, 180, 41, 0.4);
        transform: scale(1.3);
      }

      .preloader-dot.active::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        border: 1px solid rgba(240, 180, 41, 0.15);
        animation: pulse-dot 1.5s ease-in-out infinite;
      }

      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(2); opacity: 0; }
      }

      /* ===== TEXTO DE ESTADO ===== */
      .preloader-status {
        color: rgba(255, 255, 255, 0.3);
        font-size: 11px;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin-top: 18px;
        font-family: 'Inter', system-ui, sans-serif;
        transition: all 0.3s ease;
        min-height: 20px;
        position: relative;
        z-index: 2;
      }

      /* ===== PARTÍCULAS ===== */
      .particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(240, 180, 41, 0.2);
        border-radius: 50%;
        animation: particle-float linear infinite;
        pointer-events: none;
      }

      @keyframes particle-float {
        0% {
          transform: translateY(0) scale(0);
          opacity: 0;
        }
        10% {
          opacity: 1;
        }
        90% {
          opacity: 1;
        }
        100% {
          transform: translateY(-120px) scale(1);
          opacity: 0;
        }
      }

      /* ===== RESPONSIVE ===== */
      @media (max-width: 640px) {
        .preloader-logo-wrapper {
          padding: 12px;
          border-radius: 22px;
        }
        .preloader-logo-wrapper img {
          height: 60px;
        }
        .preloader-number {
          font-size: 36px;
        }
        .preloader-number .percent {
          font-size: 20px;
        }
        .preloader-bar-wrapper {
          width: 180px;
        }
        .preloader-dots {
          width: 180px;
        }
      }

      @media (max-width: 400px) {
        .preloader-logo-wrapper {
          padding: 10px;
          border-radius: 18px;
        }
        .preloader-logo-wrapper img {
          height: 48px;
        }
        .preloader-number {
          font-size: 28px;
        }
        .preloader-bar-wrapper {
          width: 150px;
        }
        .preloader-dots {
          width: 150px;
        }
      }
    </style>
  </head>
  <body>
    <!-- ============================================================
         PRELOADER
         ============================================================ -->
    <div id="preloader">
      <!-- Glows de fondo -->
      <div class="preloader-glow preloader-glow-1"></div>
      <div class="preloader-glow preloader-glow-2"></div>
      <div class="preloader-glow preloader-glow-3"></div>

      <!-- Partículas -->
      <div id="particles-container"></div>

      <!-- Logo -->
      <div class="preloader-logo-wrapper">
        <img src="/logo.png" alt="ARCO" />
      </div>

      <!-- Número -->
      <div class="preloader-number">
        <span id="progressNumber">0</span><span class="percent">%</span>
      </div>

      <!-- Barra -->
      <div class="preloader-bar-wrapper">
        <div class="preloader-bar-track">
          <div class="preloader-bar-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- Puntos -->
      <div class="preloader-dots" id="progressDots">
        <div class="preloader-dot"></div>
        <div class="preloader-dot"></div>
        <div class="preloader-dot"></div>
        <div class="preloader-dot"></div>
        <div class="preloader-dot"></div>
      </div>

      <!-- Texto -->
      <div class="preloader-status" id="statusText">Iniciando...</div>
    </div>

    <!-- ============================================================
         ROOT
         ============================================================ -->
    <div id="root"></div>

    <!-- ============================================================
         SCRIPT PRINCIPAL
         ============================================================ -->
    <script type="module" src="/src/main.jsx"></script>

    <!-- ============================================================
         SCRIPT DEL PRELOADER
         ============================================================ -->
    <script>
      (function() {
        // ===== ELEMENTOS =====
        const preloader = document.getElementById('preloader');
        const progressBar = document.getElementById('progressBar');
        const progressNumber = document.getElementById('progressNumber');
        const statusText = document.getElementById('statusText');
        const dots = document.querySelectorAll('.preloader-dot');
        const root = document.getElementById('root');

        // ===== PARTÍCULAS =====
        function createParticles() {
          const container = document.getElementById('particles-container');
          for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.width = (2 + Math.random() * 4) + 'px';
            particle.style.height = particle.style.width;
            particle.style.animationDuration = (4 + Math.random() * 6) + 's';
            particle.style.animationDelay = (Math.random() * 4) + 's';
            particle.style.opacity = 0.15 + Math.random() * 0.25;
            container.appendChild(particle);
          }
        }
        createParticles();

        // ===== PROGRESO =====
        let progress = 0;
        let isComplete = false;
        const duration = 2000;
        const interval = 25;
        const steps = duration / interval;

        const statusMessages = [
          { min: 0, max: 20, text: 'Iniciando...' },
          { min: 20, max: 45, text: 'Cargando recursos...' },
          { min: 45, max: 70, text: 'Preparando experiencia...' },
          { min: 70, max: 90, text: 'Casi listo...' }
        ];

        function updateProgress() {
          if (isComplete) return;
          
          progress += 100 / steps;
          
          if (progress >= 100) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            
            statusText.textContent = '✨ ¡Listo! ✨';
            dots.forEach(dot => dot.classList.add('active'));
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 150);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 500);
          }

          const rounded = Math.min(Math.round(progress), 100);
          progressBar.style.width = rounded + '%';
          progressNumber.innerHTML = rounded + '<span class="percent">%</span>';

          dots.forEach((dot, index) => {
            const threshold = (index + 1) * 20;
            if (rounded >= threshold) {
              dot.classList.add('active');
            } else {
              dot.classList.remove('active');
            }
          });

          const currentStatus = statusMessages.find(
            msg => rounded >= msg.min && rounded < msg.max
          );
          if (currentStatus && rounded < 100) {
            statusText.textContent = currentStatus.text;
          }
        }

        const timer = setInterval(updateProgress, interval);

        // ===== FALLBACK =====
        setTimeout(() => {
          if (!preloader.classList.contains('hidden')) {
            progress = 100;
            isComplete = true;
            clearInterval(timer);
            progressBar.style.width = '100%';
            progressNumber.innerHTML = '100<span class="percent">%</span>';
            statusText.textContent = '✨ ¡Listo! ✨';
            dots.forEach(dot => dot.classList.add('active'));
            
            setTimeout(() => {
              root.classList.add('visible');
            }, 150);
            
            setTimeout(() => {
              preloader.classList.add('hidden');
              document.body.style.overflow = '';
              document.body.style.position = '';
            }, 500);
          }
        }, 3500);

        // ===== PREVENIR SCROLL =====
        document.body.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.width = '100%';
      })();
    </script>
  </body>
</html>
