<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="arcoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a3d6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a5a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arcoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0b429;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5d06a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="100" cy="100" r="90" fill="url(#arcoGrad)" stroke="url(#arcoGold)" stroke-width="4"/>
  
  <!-- Arco (representando el nombre) -->
  <path d="M 40 130 Q 100 40 160 130" fill="none" stroke="url(#arcoGold)" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Flecha del arco -->
  <polygon points="160,130 150,115 170,115" fill="url(#arcoGold)"/>
  
  <!-- Texto ARCO -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#f0b429" text-anchor="middle" letter-spacing="8">
    ARCO
  </text>
  
  <!-- Pequeños puntos decorativos -->
  <circle cx="60" cy="70" r="3" fill="#f0b429" opacity="0.4"/>
  <circle cx="140" cy="70" r="3" fill="#f0b429" opacity="0.4"/>
  <circle cx="80" cy="55" r="2" fill="#f0b429" opacity="0.3"/>
  <circle cx="120" cy="55" r="2" fill="#f0b429" opacity="0.3"/>
</svg>